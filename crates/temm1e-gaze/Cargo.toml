[package]
name = "temm1e-gaze"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tem Gaze — vision-primary desktop control for TEMM1E"

[dependencies]
temm1e-core.workspace = true
async-trait.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true

# Desktop control
enigo = { version = "0.3", features = ["serde"] }
xcap = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }

# Native Wayland input via the XDG RemoteDesktop portal (libei): exact absolute
# pointer positioning with NO acceleration. It is part of the desktop capability —
# ALWAYS compiled in on Linux (not an opt-in feature), and never pulled on other
# OSes (which use enigo). See docs/GAZE_NATIVE_COMPUTER_USE.md and issue #70.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.12.3", default-features = false, features = ["tokio"] }
tokio = { workspace = true, features = [
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
